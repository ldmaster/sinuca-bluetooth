name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview check dependency
        run: python3 -m pip install --quiet pillow

      - name: Audit committed table GLBs
        run: python3 scripts/glb_audit.py --all

      - name: Check previews match shaders and models
        run: python3 scripts/visual_check.py --check-stamp

      - name: Check that the five styles are visually distinct
        run: python3 scripts/visual_check.py --styles

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sinuca-release.jks"

      - name: Build, test and lint (signed release)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SINUCA_KEYSTORE: ${{ runner.temp }}/sinuca-release.jks
          SINUCA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SINUCA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SINUCA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Verify release signature
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Build, test and lint (unsigned fallback)
        if: env.HAS_SIGNING_KEY != 'true'
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/sinuca-bluetooth-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/sinuca-bluetooth-${GITHUB_REF_NAME}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sinuca-bluetooth-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
